<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 5 - Full Stack Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 450px; margin: 40px auto; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea, button { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 16px; background: #007bff; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Student Registration Form</h2>
  <form action="/submit-form" method="POST">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>

    <label for="course">Course / Subject:</label>
    <input type="text" id="course" name="course" required>

    <label for="message">Remarks:</label>
    <textarea id="message" name="message" rows="3"></textarea>

    <button type="submit">Submit to Flask Backend</button>
  </form>
</body>
</html>
